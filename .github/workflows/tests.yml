name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'

      # Every dependency is public, so the install needs no token: a stranger's clone installs the
      # same way this job does.
      - name: Enable pnpm
        # `composer setup` step 5 is `pnpm install`, and the ubuntu runner image ships npm and yarn
        # only. corepack reads package.json's `packageManager` pin, so CI and a developer's machine
        # resolve the SAME pnpm — an unpinned corepack pulls latest, which has already broken
        # `pnpm.overrides` once (prove-the-beam-starter 09).
        run: corepack enable && pnpm --version

      - name: Setup Application
        run: composer setup

      # A starter's promise is that `composer setup` from a fresh clone leaves a CLEAN tree: everything
      # it publishes or generates is either tracked or ignored, so anything left over is real signal.
      # That was proven by hand once, and within days new untracked output reappeared unnoticed — a
      # promise nobody checks is not being kept. This records the tree instead of failing on the spot,
      # so a stray file cannot also cost the test suite's signal; the job fails at the end.
      - name: Record what setup left behind
        id: setup-tree
        run: git status --porcelain --untracked-files=all > "$RUNNER_TEMP/setup-tree.txt"

      # The chapter's suites and declared TypeScript contracts run keyless. The type check also
      # evaluates the negative Saved Inputs and Frame resource-map fixtures.
      - name: Run the tests
        run: composer test && pnpm test && pnpm types:check

      # `always()` so a failing suite or type check still reports a dirty tree; the outcome guard so a setup
      # that never finished cannot produce a misleading "dirty tree" failure on top of its real one.
      # This step, not SchemaArtifactDriftTest, fails CI on stale or missing committed schema projections:
      # setup regenerates resources/schemas before the tests, so the test sees a freshly generated tree here.
      - name: Setup must leave a clean tree
        if: always() && steps.setup-tree.outcome == 'success'
        run: |
          if [ -s "$RUNNER_TEMP/setup-tree.txt" ]; then
            echo "::error::composer setup left files that are neither tracked nor ignored, or modified tracked files."
            echo "Commit what setup legitimately produces, ignore what it should not, or fix the step that wrote it:"
            cat "$RUNNER_TEMP/setup-tree.txt"
            exit 1
          fi
          echo "setup left a clean tree"

      # The committed client tree (beam.client.out_dir, resources/js/generated: routes, hooks, aliases and
      # frame-resources.ts) must be what this checkout's generator writes. Setup only consumes it, so the check
      # above cannot see a stale or missing file; this step regenerates it and compares. `git status
      # --untracked-files=all`, not `git diff`, so a file the generator newly writes is caught too, and the
      # generator's own failure fails the step (bash -e). The transformer-owned namespace modules there are
      # ignored (.gitignore), so they never count. Separate from setup, after it, like the check above.
      - name: The committed client tree is fresh
        if: always() && steps.setup-tree.outcome == 'success'
        run: |
          php artisan splicewire:beam:generate:client
          drift="$(git status --porcelain --untracked-files=all -- resources/js/generated)"
          if [ -n "$drift" ]; then
            echo "::error::The committed client tree is stale: splicewire:beam:generate:client rewrote it."
            echo "Run 'php artisan splicewire:beam:generate:client' and commit resources/js/generated:"
            echo "$drift"
            git --no-pager diff --stat -- resources/js/generated
            exit 1
          fi
          echo "the committed client tree is what the generator writes"
